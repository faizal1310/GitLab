
name: Secure Secrets Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use API Key
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret is configured and available"
          else
            echo "Secret is missing"
            exit 1
          fi
        env:
          API_KEY: ${{ secrets.API_KEY }}
